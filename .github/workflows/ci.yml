name: CI Quality Gate

on:
  push:
    branches: [main, dev, 'phase-*']
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests & Coverage
        run: npm run test:coverage

  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Production dependency critical audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Full advisory audit report (non-blocking)
        run: npm audit --audit-level=high || true

      - name: Secret & key leak scan
        run: |
          if git ls-files | grep -E '^\.env(\..+)?$' | grep -v '^\.env\.example$'; then
            echo "ERROR: Tracked .env file detected in repository!"
            exit 1
          fi
          if git grep -n -E 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|GOCSPX-[0-9A-Za-z_-]+' -- ':!docs/' ':!tests/'; then
            echo "ERROR: Potential credential or private key detected in tracked files!"
            exit 1
          fi
          echo "Secret scan clean."

  integration:
    name: Supabase Integration & RLS Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0

      - name: Start Supabase local stack & apply all 21 migrations
        run: supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime

      - name: Verify RLS enabled on every public table
        run: |
          DB_CID="$(docker ps -qf name=supabase_db_)"
          UNPROTECTED="$(docker exec "$DB_CID" psql -U postgres -Atc "SELECT COUNT(*) FROM pg_tables WHERE schemaname = 'public' AND rowsecurity = false;")"
          echo "Public tables without RLS: $UNPROTECTED"
          if [ "$UNPROTECTED" != "0" ]; then
            docker exec "$DB_CID" psql -U postgres -c "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND rowsecurity = false;"
            exit 1
          fi

      - name: Run Integration Tests
        run: npm run test:integration
