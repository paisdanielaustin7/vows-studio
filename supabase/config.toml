# Supabase CLI configuration for VOWS Studio
project_id = "vows-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "app", "storage", "graphql_public"]
extra_search_path = ["public", "extensions", "app"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "52428800" # 50MiB

[storage.buckets.portfolio]
public = true
file_size_limit = "20971520" # 20MB
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.branding]
public = true
file_size_limit = "5242880" # 5MB
allowed_mime_types = ["image/png", "image/svg+xml", "image/jpeg", "image/webp"]

[storage.buckets.documents]
public = false
file_size_limit = "10485760" # 10MB
allowed_mime_types = ["application/pdf", "text/csv", "application/zip"]

[storage.buckets.client-uploads]
public = false
file_size_limit = "52428800" # 50MB

[storage.buckets.expense-receipts]
public = false
file_size_limit = "10485760" # 10MB
allowed_mime_types = ["image/jpeg", "image/png", "application/pdf"]

[storage.buckets.crew-assets]
public = false
file_size_limit = "10485760" # 10MB
